name: ticket watch

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Send one clearly labelled setup test notification'
        type: boolean
        default: false
      golden_boy_test_notification:
        description: 'Test Golden Boy email and official booking-page connectivity'
        type: boolean
        default: false
      jcs_probe:
        description: 'Manual diagnostic only: LW currently rejects the cloud browser; not an active ticket monitor'
        type: boolean
        default: false

concurrency:
  group: eurotrash-ticket-watch
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    # Standard public-repository Linux runner: no paid services or large runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test theatre monitors
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/test_scheduler.cjs
      - name: Check official public Eurotrash ticket status
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY_USER: ${{ github.repository_owner }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: python3 monitor.py
      - name: Check Almeida Golden Boy official availability
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY_USER: ${{ github.repository_owner }}
          TEST_NOTIFICATION: ${{ inputs.golden_boy_test_notification }}
          VERIFY_BOOKING_PROBE: ${{ inputs.golden_boy_test_notification }}
        run: xvfb-run -a python3 golden_boy.py
      - name: Check Suranne Jones exact An Oak Tree performance
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY_USER: ${{ github.repository_owner }}
        run: python3 an_oak_tree.py
      - name: Check Virginia Woolf London today only
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY_USER: ${{ github.repository_owner }}
        run: xvfb-run -a python3 virginia_woolf.py

  jcs:
    # Separate job after the other shows: a slow LW booking site cannot
    # consume their job timeout. Serial state writes avoid branch conflicts.
    needs: check
    if: ${{ always() && !cancelled() && inputs.jcs_probe == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check each JCS 25 pound On-Stage Standing area through October 31
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY_USER: ${{ github.repository_owner }}
        run: xvfb-run -a python3 jcs_on_stage.py
