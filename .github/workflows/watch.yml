name: Eurotrash ticket watch

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Send one clearly labelled setup test notification'
        type: boolean
        default: false

concurrency:
  group: eurotrash-ticket-watch
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check official public Eurotrash ticket status
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY_USER: ${{ github.repository_owner }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: xvfb-run -a python3 monitor.py
